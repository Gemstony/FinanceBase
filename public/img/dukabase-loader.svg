<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DukaBase Loading">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes dash {
        0% { stroke-dasharray: 1, 300; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 150, 300; stroke-dashoffset: -80; }
        100% { stroke-dasharray: 150, 300; stroke-dashoffset: -260; }
      }
      @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- Outer ring -->
  <g transform="translate(60,60)">
    <circle r="46" fill="none" stroke="#e5e7eb" stroke-width="8"/>
    <circle r="46" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"
            style="transform-origin: center; animation: dash 1.4s ease-in-out infinite, spin 1.6s linear infinite;"/>
  </g>

  <!-- DB Monogram Badge -->
  <g transform="translate(60,60)">
    <circle r="30" fill="#0b1220" opacity="0.9"/>
    <text x="0" y="8" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="28" font-weight="700" fill="white">DB</text>
  </g>

  <!-- Caption -->
  <text x="60" y="112" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="12" fill="#4b5563" style="animation: pulse 1.6s ease-in-out infinite;">Loading DukaBase…</text>
</svg>
